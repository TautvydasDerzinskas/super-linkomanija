name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs a release on demand, for example after unpausing releases
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run build:site
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: extension/
      - uses: actions/upload-artifact@v7
        with:
          name: extension-firefox
          path: extension-firefox/

  release:
    needs: build
    # Set the repository variable RELEASE_PAUSED to "true" to keep merging to main without publishing
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RELEASE_PAUSED != 'true'
    runs-on: ubuntu-latest
    # Never run two releases at once, they would compete for the same version
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Starting the website workflow after a release
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: before
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      # Builds happen inside semantic-release, after it sets the release version
      - run: npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      # The release commit skips CI, so the website is redeployed here to show the new version
      - name: Update the website after a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(git describe --tags --abbrev=0)" != "${{ steps.before.outputs.tag }}" ]; then
            gh workflow run pages.yml --ref main
          fi
