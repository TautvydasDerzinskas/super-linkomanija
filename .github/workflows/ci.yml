name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Releases only happen from these two: on demand, and every Friday at 13:00 Polish time
  workflow_dispatch:
  schedule:
    # Cron runs in UTC, 13:00 in Poland is 11:00 UTC in summer and 12:00 UTC in winter, see the release-time job
    - cron: '0 11 * * 5'
    - cron: '0 12 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run build:site
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: extension/
      - uses: actions/upload-artifact@v7
        with:
          name: extension-firefox
          path: extension-firefox/

  release-time:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      # Checks which schedule started the run instead of the current time, as scheduled runs can start late
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$(TZ=Europe/Warsaw date +%z)" = "+0200" ]; then expected='0 11 * * 5'; else expected='0 12 * * 5'; fi
          echo "due=$([ "$SCHEDULE" = "$expected" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    needs: [build, release-time]
    # Set the repository variable RELEASE_PAUSED to "true" to skip the Friday releases, e.g. while stores review a version
    if: >-
      !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && needs.release-time.outputs.due == 'true' && vars.RELEASE_PAUSED != 'true'))
    runs-on: ubuntu-latest
    # Never run two releases at once, they would compete for the same version
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Starting the website workflow after a release
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: before
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      # Builds happen inside semantic-release, after it sets the release version
      - run: npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      # The release commit skips CI, so the website is redeployed here to show the new version
      - name: Update the website after a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(git describe --tags --abbrev=0)" != "${{ steps.before.outputs.tag }}" ]; then
            gh workflow run pages.yml --ref main
          fi
