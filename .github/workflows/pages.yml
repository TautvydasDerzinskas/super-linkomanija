name: Website

# The project's page on GitHub Pages, built by site/build.js from site/ plus images from the extension
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - src/assets/icons/**
      - src/assets/images/**
      - src/assets/vectors/**
      - .github/workflows/pages.yml
  # Also started by the release job, so the page shows the new version
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The build script only uses Node's standard library, no npm install needed
      - run: npm run build:site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
