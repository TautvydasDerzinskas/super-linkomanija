<!doctype html>
<html><body>
<!-- Generates src/assets/images/header_night.webp, the dark theme header: open in Chrome and save the data URL below as WebP -->
<canvas id="c" width="2000" height="760"></canvas>
<pre id="out"></pre>
<script>
const W = 2000, H = 760;
const ctx = document.getElementById('c').getContext('2d');

// Seeded RNG so the image is reproducible
let seed = 20261005;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

// Sky: near-black navy at the top, deep blue towards the horizon
const sky = ctx.createLinearGradient(0, 0, 0, H);
sky.addColorStop(0, '#01030c');
sky.addColorStop(0.45, '#040b22');
sky.addColorStop(0.8, '#0a1840');
sky.addColorStop(1, '#10214f');
ctx.fillStyle = sky;
ctx.fillRect(0, 0, W, H);

// Horizon glow, sky on the left and indigo on the right (the 3MF Sanitizer glows)
const glow = (x, y, rx, ry, color, a) => {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(${color},${a})`);
  g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g;
  ctx.fillRect(-rx, -rx, rx * 2, rx * 2);
  ctx.restore();
};
glow(W * 0.15, H * 1.02, 900, 380, '56,189,248', 0.22);
glow(W * 0.85, H * 1.0, 850, 360, '99,102,241', 0.24);

// Milky Way: a diagonal band of soft clouds
const band = t => ({ x: t * W, y: H * 0.95 - t * H * 0.9 + Math.sin(t * 5) * 40 });
ctx.globalCompositeOperation = 'lighter';
for (let i = 0; i < 260; i++) {
  const t = rnd(), p = band(t), off = gauss() * 70;
  const blue = rnd() < 0.5;
  glow(p.x + off * 0.5, p.y + off, 60 + rnd() * 160, 40 + rnd() * 90, blue ? '125,211,252' : '129,140,248', 0.012 + rnd() * 0.018);
}
// Dark dust lane along the band
ctx.globalCompositeOperation = 'source-over';
for (let i = 0; i < 90; i++) {
  const t = rnd(), p = band(t);
  glow(p.x + gauss() * 20, p.y + gauss() * 18, 40 + rnd() * 80, 12 + rnd() * 20, '2,6,23', 0.10 + rnd() * 0.08);
}

// Stars
const tints = ['255,255,255', '224,242,254', '186,230,253', '199,210,254', '254,243,199'];
const star = (x, y, r, a, tint) => {
  ctx.fillStyle = `rgba(${tint},${a})`;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
};
ctx.globalCompositeOperation = 'lighter';
// Background field, fading towards the horizon
for (let i = 0; i < 3200; i++) {
  const x = rnd() * W, y = Math.pow(rnd(), 1.25) * H;
  const fade = 1 - y / H * 0.7;
  star(x, y, 0.35 + Math.pow(rnd(), 4) * 1.1, (0.15 + rnd() * 0.65) * fade, tints[Math.floor(rnd() * tints.length)]);
}
// Dense band stars
for (let i = 0; i < 2600; i++) {
  const t = rnd(), p = band(t), off = gauss() * 55;
  star(p.x + off * 0.5, p.y + off, 0.3 + Math.pow(rnd(), 5) * 0.9, 0.12 + rnd() * 0.5, tints[Math.floor(rnd() * 4)]);
}
// Bright stars with a halo and faint spikes
for (let i = 0; i < 26; i++) {
  const x = rnd() * W, y = Math.pow(rnd(), 1.4) * H * 0.8, s = 0.6 + rnd() * 1.1;
  const tint = tints[Math.floor(rnd() * 4)];
  glow(x, y, 14 * s, 14 * s, tint, 0.35);
  star(x, y, 1.3 * s, 0.95, '255,255,255');
  ctx.strokeStyle = `rgba(${tint},0.28)`;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(x - 16 * s, y); ctx.lineTo(x + 16 * s, y);
  ctx.moveTo(x, y - 16 * s); ctx.lineTo(x, y + 16 * s);
  ctx.stroke();
}
ctx.globalCompositeOperation = 'source-over';

// Hills silhouette, two layers, the front one matching the popup's surface
const hills = (base, amp, color, phase) => {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) {
    const y = base - Math.sin(x / 310 + phase) * amp - Math.sin(x / 137 + phase * 2) * amp * 0.35 - Math.sin(x / 61) * amp * 0.08;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.fill();
};
hills(H * 0.9, 26, '#060d26', 1.3);
hills(H * 0.95, 18, '#020617', 4.1);

document.getElementById('out').textContent = document.getElementById('c').toDataURL('image/webp', 0.85);
</script>
</body></html>
